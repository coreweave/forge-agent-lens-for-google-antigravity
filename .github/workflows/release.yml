name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.11.21

jobs:
  build:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: forge-agent-lens-for-google-antigravity
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install locked dependencies
        working-directory: forge-agent-lens-for-google-antigravity
        run: uv sync --locked --group test

      - name: Verify tag and package versions
        working-directory: forge-agent-lens-for-google-antigravity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(uv run --no-sync python -c 'from forge_antigravity import __version__; print(__version__)')"
          PYPROJECT_VERSION="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$PACKAGE_VERSION" = "$PYPROJECT_VERSION"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          grep -F "## [$PACKAGE_VERSION]" CHANGELOG.md
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main

      - name: Run release checks
        working-directory: forge-agent-lens-for-google-antigravity
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync coverage run -m pytest
          uv run --no-sync coverage report

      - name: Build release artifacts
        working-directory: forge-agent-lens-for-google-antigravity
        run: |
          set -euo pipefail
          VERSION="$(uv run --no-sync python -c 'from forge_antigravity import __version__; print(__version__)')"
          uv build
          uvx --from twine==7.0.0 twine check dist/forge_agent_lens_for_google_antigravity-*
          mkdir -p dist/plugin-archive
          cp -R plugin/. dist/plugin-archive/
          (cd dist/plugin-archive && zip -qr "../forge-agent-lens-for-google-antigravity-plugin-$VERSION.zip" .)
          tar -czf "dist/forge-agent-lens-for-google-antigravity-plugin-$VERSION.tar.gz" -C plugin .
          rm -rf dist/plugin-archive
          (cd dist && sha256sum forge_agent_lens_for_google_antigravity-* forge-agent-lens-for-google-antigravity-plugin-* > SHA256SUMS)

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: forge-agent-lens-for-google-antigravity/dist/forge_agent_lens_for_google_antigravity-*
          if-no-files-found: error

      - name: Upload plugin archives and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-archives-and-checksums
          path: |
            forge-agent-lens-for-google-antigravity/dist/forge-agent-lens-for-google-antigravity-plugin-*
            forge-agent-lens-for-google-antigravity/dist/SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/forge-agent-lens-for-google-antigravity
    permissions:
      id-token: write # Required for PyPI trusted publishing.
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release and upload its artifacts.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --title "Forge Agent Lens for Google Antigravity $RELEASE_TAG" \
            --verify-tag
